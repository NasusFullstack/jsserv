<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>관리 · {{SITE}}</title>
<meta name="theme-color" content="#05060a">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/layers.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/admin.css">
<link rel="stylesheet" href="/static/css/motion.css">
<script type="module" src="/static/js/admin/main.js"></script>
</head>
<body class="admin">
<!-- 로고 색 (숨긴 칸 안에 두면 안 그려져서 따로) -->
<svg class="svg-defs" aria-hidden="true"><defs><linearGradient id="lm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs></svg>

<div class="layers" aria-hidden="true">
  <div class="layer layer--base"></div>
  <div class="layer layer--aurora"><i></i><i></i><i></i></div>
  <div class="layer layer--grid"></div>
  <div class="layer layer--grain"></div>
</div>

<!-- ===== 잠금 화면 ===== -->
<section class="lock" id="lock">
  <form class="lock__card glass" id="lockForm" autocomplete="on">
    <svg class="lock__mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="none" stroke="url(#lm)" stroke-width="2"/><path d="M9 23V9l14 14V9" fill="none" stroke="url(#lm)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1 class="lock__title">관리 화면</h1>
    <p class="lock__sub">열쇠를 넣으면 이 탭에서만 기억합니다. 탭을 닫으면 잊습니다.</p>
    <!-- 브라우저 비밀번호 저장이 열쇠를 기억할 수 있게 이름 칸을 숨겨 둔다 -->
    <input type="text" name="username" value="{{SITE}}" autocomplete="username" hidden>
    <label class="field">
      <span class="field__label">열쇠</span>
      <input type="password" id="key" name="password" autocomplete="current-password" required spellcheck="false" placeholder="열쇠 붙여 넣기">
    </label>
    <button class="btn btn--primary lock__go" type="submit"><span>들어가기</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <p class="lock__err" id="lockErr" role="alert"></p>
    <a class="lock__back" href="/">← 사이트로</a>
  </form>
</section>

<!-- ===== 관리 ===== -->
<div class="console" id="console" hidden>
  <aside class="side">
    <a class="side__brand" href="/" title="사이트 보기">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="none" stroke="url(#lm)" stroke-width="2"/><path d="M9 23V9l14 14V9" fill="none" stroke="url(#lm)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span><b data-site-name>{{SITE}}</b><small class="mono">ADMIN</small></span>
    </a>
    <nav class="side__nav" aria-label="관리 메뉴">
      <button data-view="dash" aria-current="page"><span class="mono">01</span>대시보드</button>
      <button data-view="works"><span class="mono">02</span>작품</button>
      <button data-view="comments"><span class="mono">03</span>댓글</button>
      <button data-view="settings"><span class="mono">04</span>사이트 설정</button>
    </nav>
    <div class="side__foot">
      <a class="btn btn--ghost btn--sm" href="/" target="_blank" rel="noopener">사이트 보기 ↗</a>
      <button class="btn btn--ghost btn--sm" id="lockBtn">잠그기</button>
    </div>
  </aside>

  <main class="pane">
    <section class="view" id="view-dash"></section>
    <section class="view" id="view-works" hidden></section>
    <section class="view" id="view-comments" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
